name: CPU and native mock validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m rtx5090.conda cpu-test --out runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-validation
          path: runs/ci/
