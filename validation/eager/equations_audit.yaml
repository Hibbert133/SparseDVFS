paper: https://arxiv.org/html/2603.21908v1
audit_date: '2026-11-06'
equation_1:
  section: '4.1.1'
  expression: 'max(W*(1-Sc)/P, D*(1-Sm)/B) + overhead'
  implementation: sparsedvfs/paper_core.py:timeline_seconds
  units: [FLOP, byte, FLOP/s, byte/s, s]
