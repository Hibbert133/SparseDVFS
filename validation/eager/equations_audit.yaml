  section: '4.1.2'
  expression: 'alpha*V^2*f + (k1*T+k2)*V'
  implementation: sparsedvfs/paper_core.py:thermal_power_w
  frequency_unit: Hz
  temperature_unit: Celsius
implementation_choices:
  - GPU-only conditional projection; not CPU/GPU/EMC reproduction
  - Independent evaluation of each equation with missing parameter report
  - Dense effective sparsity fixed at zero without skipping evidence
  - No implicit conversion of logical tensor bytes to measured traffic
unresolved:
  - Same-path compute capacity and bandwidth and overhead
  - Cache and internal workspace traffic
  - Voltage evidence and identifiable thermal coefficients
  - Independent operator validation on both ranks
verification:
