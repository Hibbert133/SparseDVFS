paper:
  version: 'arXiv:2603.21908v1'
  section: '4.1.1'
  equation_number: 1
  url: 'https://arxiv.org/html/2603.21908v1'
  equation: >-
    T_exe(f) = max(W_comp * (1-S_comp) / P_peak(f_cpu,f_gpu),
    D_mem * (1-S_mem) / B_mem(f_mem)) + T_overhead

paper_specified:
  W_comp: '根据算子尺寸得到的理论计算量，单位 FLOP'
  S_comp: '硬件可有效跳过的计算比例；不能直接用张量零值比例代替'
  D_mem: '数据量，单位 byte；具体统计口径仍需核实'
  S_mem: '存储稀疏带来的带宽节省系数，与 S_comp 分别处理'
  P_peak: '对应 CPU/GPU 频率的计算能力，文中要求通过离线微基准获得'
  B_mem: '对应内存频率的带宽，文中要求通过离线微基准获得'
  T_overhead: '包含 kernel launch、同步等常量系统开销，单位 s'
  composition: '计算与访存时间取最大值，再加 T_overhead'

